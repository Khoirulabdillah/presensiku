<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Deteksi Wajah</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>🎯 Aplikasi Deteksi Wajah Sederhana</h1>
        <p class="subtitle">Unggah foto Anda untuk mendeteksi wajah secara otomatis</p>
        
        <div class="upload-section">
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="file-input" class="file-label">
                        <div class="file-input-wrapper">
                            <span class="upload-icon">📁</span>
                            <span class="upload-text">Klik untuk memilih file atau drag & drop</span>
                        </div>
                        <input type="file" id="file-input" name="file" accept="image/*" required>
                    </label>
                    <p class="file-info">Format yang didukung: PNG, JPG, JPEG, GIF, BMP (Maks: 16MB)</p>
                </div>
                
                <button type="submit" class="btn-detect">Deteksi Wajah</button>
            </form>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Sedang memproses gambar...</p>
        </div>

        <div id="preview-section" class="preview-section hidden">
            <img id="preview-image" src="" alt="Preview">
            <p id="file-name"></p>
        </div>

        <div id="error-message" class="error hidden"></div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('file-input');
        const fileLabel = document.querySelector('.file-label');
        const loading = document.getElementById('loading');
        const previewSection = document.getElementById('preview-section');
        const previewImage = document.getElementById('preview-image');
        const fileName = document.getElementById('file-name');
        const errorMessage = document.getElementById('error-message');

        // Drag and drop
        fileLabel.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileLabel.classList.add('dragover');
        });

        fileLabel.addEventListener('dragleave', () => {
            fileLabel.classList.remove('dragover');
        });

        fileLabel.addEventListener('drop', (e) => {
            e.preventDefault();
            fileLabel.classList.remove('dragover');
            fileInput.files = e.dataTransfer.files;
            showPreview();
        });

        // File input change
        fileInput.addEventListener('change', showPreview);

        function showPreview() {
            const file = fileInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImage.src = e.target.result;
                    fileName.textContent = `Pilihan: ${file.name}`;
                    previewSection.classList.remove('hidden');
                    errorMessage.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        // Form submit
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const file = fileInput.files[0];
            if (!file) return;

            loading.classList.remove('hidden');
            errorMessage.classList.add('hidden');

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/detect', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const html = await response.text();
                    document.body.innerHTML = html;
                } else {
                    const data = await response.json();
                    showError(data.error || 'Terjadi kesalahan saat memproses gambar');
                    loading.classList.add('hidden');
                }
            } catch (error) {
                showError('Gagal menghubungi server: ' + error.message);
                loading.classList.add('hidden');
            }
        });

        function showError(message) {
            errorMessage.textContent = '❌ ' + message;
            errorMessage.classList.remove('hidden');
        }
    </script>
</body>
</html>
